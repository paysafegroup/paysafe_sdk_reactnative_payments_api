def readMonorepoReactNativeVersion = {
  def packageJson = new File(settingsDir, "node_modules/react-native/package.json")
  if (!packageJson.exists()) {
    return "0.76.9"
  }
  def parsed = new groovy.json.JsonSlurper().parse(packageJson)
  return parsed.version as String
}

gradle.projectsLoaded {
  def monorepoReactNativeVersion = readMonorepoReactNativeVersion()

  gradle.rootProject {
    it.subprojects { subproject ->
      subproject.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
          if (details.requested.group == "com.facebook.react"
            && details.requested.name == "react-android") {
            details.useVersion(monorepoReactNativeVersion)
            details.because(
              "Monorepo pins react-android to react-native ${monorepoReactNativeVersion} " +
                "(react-android:+ otherwise resolves to Maven 0.88+ and breaks Kotlin 2.0.x CI)"
            )
          }
        }
      }

      subproject.afterEvaluate {
        if (subproject.plugins.hasPlugin("com.android.library")) {
          def jacocoFile = file("${rootDir}/jacoco.gradle")
          if (jacocoFile.exists()) {
            subproject.apply from: jacocoFile
            println "Applied Jacoco to ${subproject.name}"
          }
        }
      }
    }
  }
}

rootProject.name = 'paysafe-ph-mobile-sdk-react-native'

